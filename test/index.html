<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>card gacha</title>
<script>
(function(){try{
if(!('IntersectionObserver' in window))return;
var io=new IntersectionObserver(function(es){
  var v=es[0]&&es[0].isIntersecting;
  document.documentElement.classList.toggle('mk-off',!v);
},{threshold:0});
io.observe(document.documentElement);
}catch(e){}})();
</script>
<style>
.mk-off *{animation-play-state:paused !important}
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:transparent}
body{display:flex;justify-content:center;align-items:center;-webkit-tap-highlight-color:transparent}
.gwrap{position:relative;width:min(600px, 92vw, calc(94vh * 0.7500));aspect-ratio:3 / 4;cursor:pointer;touch-action:manipulation}
.packglow{position:absolute;left:50%;top:50%;width:160%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;z-index:1;will-change:opacity;background:radial-gradient(circle,rgba(255,220,120,.32),transparent 60%);transition:opacity .3s ease}
.gwrap.opened .packglow{opacity:0 !important}
.pack,.result{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden}
.pack{border-radius:20px}.result{border-radius:20px}
.pack{box-shadow:0 12px 28px rgba(0,0,0,.28);background:#fff}
.result{box-shadow:0 12px 28px rgba(0,0,0,.28);background:#fff}
.pack img,.result img{width:100%;height:100%;object-fit:cover;display:block}
.pack{transition:opacity .25s,transform .25s;z-index:2;will-change:transform,opacity}
@media (prefers-reduced-motion: no-preference){
.pack{animation:breath 3.4s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.packglow{animation:gpulse 3.4s ease-in-out infinite}
@keyframes gpulse{0%,100%{opacity:.55}50%{opacity:1}}
}
.pack.hide{animation:none;opacity:0;transform:scale(.85);pointer-events:none}
@keyframes gShake{0%{transform:rotate(0) scale(1)}15%{transform:rotate(-3deg) scale(1.01)}30%{transform:rotate(3deg) scale(1.03)}45%{transform:rotate(-5deg) scale(1.05)}60%{transform:rotate(5deg) scale(1.07)}75%{transform:rotate(-6deg) scale(1.08)}90%{transform:rotate(4deg) scale(1.08)}100%{transform:rotate(0) scale(1.06)}}
@media (prefers-reduced-motion: no-preference){
.pack.shake{animation:gShake .7s ease-in-out}
}
.flash{position:absolute;top:-20%;left:-20%;width:140%;height:140%;pointer-events:none;z-index:6;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,0) 60%);opacity:0;will-change:opacity}
.flash.go{animation:flashGo .4s ease-out}
@keyframes flashGo{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.rays{position:absolute;left:50%;top:50%;width:210%;aspect-ratio:1;pointer-events:none;z-index:3;-webkit-mask-image:radial-gradient(circle,#000 50%,transparent 72%);mask-image:radial-gradient(circle,#000 50%,transparent 72%);transform:translate(-50%,-50%) scale(0);opacity:0;will-change:transform,opacity;transition:opacity .45s ease,transform .55s cubic-bezier(.2,.8,.3,1.1)}
.rays.go{opacity:1;transform:translate(-50%,-50%) scale(1)}
.raysdisc{width:100%;height:100%;border-radius:50%;will-change:transform;background:repeating-conic-gradient(rgba(255,214,110,.30) 0 7deg,rgba(255,214,110,0) 7deg 20deg);-webkit-mask-image:radial-gradient(circle,#000 26%,transparent 66%);mask-image:radial-gradient(circle,#000 26%,transparent 66%)}
@media (prefers-reduced-motion: no-preference){
.raysdisc{animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
}
.resglow{position:absolute;left:-14%;top:-14%;width:128%;height:128%;pointer-events:none;z-index:4;opacity:0;will-change:opacity;background:radial-gradient(circle,rgba(255,215,130,.5) 34%,transparent 72%)}
@media (prefers-reduced-motion: no-preference){
.gwrap.opened .resglow{animation:rpulse 2.6s ease .5s infinite}
@keyframes rpulse{0%,100%{opacity:.3}50%{opacity:.8}}
}
.result{z-index:5;opacity:0;transform:scale(.7);pointer-events:none;will-change:transform,opacity}
@keyframes gPop{0%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
.result.show{opacity:1;transform:scale(1);animation:gPop .5s cubic-bezier(.34,1.56,.64,1) forwards}
.result.show.bye{animation:byeUp .3s ease forwards}
@keyframes byeUp{to{opacity:0;transform:scale(.92) translateY(-26px)}}
.tw{position:absolute;font:700 15px sans-serif;color:#ffe9b0;pointer-events:none;z-index:8;text-shadow:0 0 8px rgba(255,215,130,.9);opacity:0;will-change:transform,opacity}
@media (prefers-reduced-motion: no-preference){
.result.show .tw{animation:twinkle 1.9s ease-in-out infinite}
.result.show .tw.t2{animation-delay:.6s}
.result.show .tw.t3{animation-delay:1.2s}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
}
</style>
<style>.mk-key-focus:focus-visible{outline:3px solid #ffd66b!important;outline-offset:4px!important}</style>
</head>
<body>
<div class="gwrap" id="g">
  <div class="packglow"></div>
  <div class="pack" id="pack" data-mk-adjust-box="pack"><img id="packImg" src="./1.webp" alt=""></div>
  <div class="rays" id="rays"><div class="raysdisc"></div></div>
  <div class="resglow"></div>
  <div class="result" id="res"><img id="resImg" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt=""><img class="mk-frame-layer" src="./2.webp" alt="" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:fill;pointer-events:none;"><span class="tw" style="left:14%;top:10%">✦</span><span class="tw t2" style="left:80%;top:20%">✦</span><span class="tw t3" style="left:68%;top:84%">✦</span></div>
  <div class="flash" id="flash"></div>
</div>
<script>
(function(){
function sparks(host,n){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var colors=["#ffd97a","#ffe9b0","#ffc65c","#fff3d6"];
  for(var i=0;i<n;i++){
    var s=document.createElement("span");
    s.textContent=Math.random()<.55?"\u2726":"\u25CF";
    s.style.cssText="position:absolute;left:50%;top:50%;z-index:40;pointer-events:none;"
      +"font:700 "+(9+Math.random()*13)+"px sans-serif;color:"+colors[i%4]+";"
      +"text-shadow:0 0 6px rgba(255,215,130,.8);transform:translate(-50%,-50%);will-change:transform,opacity";
    host.appendChild(s);
    var a=Math.random()*Math.PI*2,d=80+Math.random()*150;
    var dx=Math.cos(a)*d,dy=Math.sin(a)*d-30;
    s.animate([
      {transform:"translate(-50%,-50%) scale(.4) rotate(0deg)",opacity:1},
      {transform:"translate(calc(-50% + "+dx+"px), calc(-50% + "+dy+"px)) scale(1.15) rotate("+(Math.random()*260-130)+"deg)",opacity:0}
    ],{duration:650+Math.random()*400,easing:"cubic-bezier(.15,.75,.4,1)"})
    .onfinish=(function(el){return function(){el.remove();};})(s);
  }
}
var cards=["./3.webp","./4.webp","./5.webp","./6.webp","./7.webp","./8.webp","./9.webp","./10.webp"];
var ADJ=["","","","","","","",""];
var OPEN="";
var PACK_T="";
var OPEN_T="";
cards.forEach(function(u){var im=new Image();im.src=u;});
if(OPEN){var oi=new Image();oi.src=OPEN;}
var g=document.getElementById('g'),pack=document.getElementById('pack'),
  packImg=document.getElementById('packImg'),
  rays=document.getElementById('rays'),res=document.getElementById('res'),
  resImg=document.getElementById('resImg'),flash=document.getElementById('flash'),state=0;
var PACK=packImg.src;
g.addEventListener('click',function(){
  if(state===1||state===3)return;
  if(state===2){
    state=3;res.classList.add('bye');rays.classList.remove('go');g.classList.remove('opened');
    setTimeout(function(){
      packImg.src=PACK;packImg.style.transform=PACK_T;
      res.classList.remove('show','bye');pack.classList.remove('hide');state=0;
    },320);
    return;
  }
  state=1;pack.classList.add('shake');
  setTimeout(function(){
    pack.classList.remove('shake');
    var delay=0;
    if(OPEN){packImg.src=OPEN;packImg.style.transform=OPEN_T;delay=320;}
    setTimeout(function(){
      pack.classList.add('hide');
      g.classList.add('opened');
      flash.classList.add('go');
      var pick=Math.floor(Math.random()*cards.length);
      resImg.src=cards[pick];
      resImg.style.transform=ADJ[pick]||'';
      rays.classList.add('go');res.classList.add('show');
      setTimeout(function(){flash.classList.remove('go');state=2;},750);
      try{sparks(g,16);}catch(e){}
    },delay);
  },640);
});
})();
</script>
<script>
(function(){
var nodes=[].slice.call(document.querySelectorAll("#g"));
nodes.forEach(function(el){el.tabIndex=0;el.setAttribute("role","button");el.setAttribute("aria-label","카드 뽑기");el.classList.add("mk-key-focus");
el.addEventListener("keydown",function(e){if(e.key!=="Enter"&&e.key!==" ")return;e.preventDefault();el.click();});});
})();
</script>
</body>
</html>
